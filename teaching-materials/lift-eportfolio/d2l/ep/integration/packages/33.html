		function DownloadToZip( dwType, aparam, funcGetList ) {
	var pZip = new d2l_Popup();
	pZip.height = 350;
	pZip.width = 750;
	pZip.title = 'Downloading Files';
	pZip.bodySource = '/d2l/lms/dropbox/download_files.d2l';
	pZip.queryString = 'ou=379439&db=325445&dwt=' + dwType + '&addp=' + aparam + '&fn=' + funcGetList;
	pZip.AddCloseButton();
	pZip.Open();
}

function IsFileEpArtifact( fileId ) {
    return new Promise( function( resolve ) {
        D2L.Rpc.Create('IsFileEpArtifact',
            function( response ) {
                resolve( response.GetResult() );
            }, '/d2l/lms/dropbox/rpc/rpc_functions.d2l').Call( fileId );
    });
}

function GetDownloadSubmissionUrl( dropboxId, fileId, entityId, submissionId ) {
	return new Promise( function( resolve ) {
		D2L.Rpc.Create( 'GetDownloadSubmissionUrl', function( response ) {
			resolve( response.GetResult() );
		}, '/d2l/lms/dropbox/rpc/rpc_functions.d2l').Call( dropboxId, fileId, entityId, submissionId );
	} );
}

function DownloadLink(submissionId, linkId, linkUrl) {
	var callBack = function(rpcResponse) {
		if (rpcResponse.GetResponseType() == D2L.Rpc.ResponseType.Success) {
			var controlId = 'L' + linkId;
			SetAttachmentAsRead( controlId );

			var ni = new D2L.NavInfo();
			ni.SetNavigation( linkUrl.replace('&amp;', '&') );
			ni.SetTarget( '_blank' + controlId );
			Nav.Go( ni );
		}
	};
	var rpc = D2L.Rpc.Create( 'UpdateLinkRead', callBack, '/d2l/lms/dropbox/rpc/rpc_functions.d2l' );
	rpc.Call( 325445, submissionId, linkId, true );
}

function DownloadFile(dropboxId, fileId, entityId, submissionId, dropboxTypeId) {
	var callBack = function(rpcResponse) {
		if (rpcResponse.GetResponseType() == D2L.Rpc.ResponseType.Success) {
			SetFileAsRead('F' + fileId);
			var ni = new D2L.NavInfo();
			GetDownloadSubmissionUrl( dropboxId, fileId, entityId, submissionId )
				.then( function( navigationUrl ) {
                    ni.SetNavigation( navigationUrl );
                    Nav.Go( ni );
				} );
		}
	};
	var rpc = D2L.Rpc.Create( 'UpdateFileRead', callBack, '/d2l/lms/dropbox/rpc/rpc_functions.d2l' );
	rpc.Call( 325445, fileId, true, dropboxTypeId, false );
}

function EvaluateSubmission(dropboxId, entityId, isLink, fileOrLinkId, submissionId, dropboxTypeId) {
	var ni = new D2L.NavInfo();
	ni.SetParam('db', dropboxId);
	ni.SetParam('isLink', isLink)
	ni.SetParam('fileOrLinkId', fileOrLinkId);
	ni.SetParam('subId', submissionId);
	ni.SetAction('Custom');
	ni.SetActionParam('feedback,' + entityId + ',' + isLink + ',' + fileOrLinkId + ',' + submissionId + "," + dropboxTypeId);
	ni.SetNavigation('/d2l/lms/dropbox/admin/mark/folder_submissions_users.d2l');
	Nav.Go(ni);
}

function IsAttachmentFile(attachment) {
	return attachment.id && !attachment.isLink;
}

function GetAttachmentFileId(attachment) {
	return attachment.id;
}

function ParseAttachmentControlId(controlId) {
    var match = controlId.match(/^\s*([fl]?)(\d+)(?:\.(\d+))?\s*$/i);
	if (!match) {
		return {};
	}
    var isLink = (match[1] || '').toLowerCase() === 'l';
	return {
		isLink: isLink,
		controlId: match[1] + match[2],
		id: match[2],
		submissionId: match[3]
	};
}

function SetReturnPointAndEvaluateOrDownload(
    event,
    dropboxId,
    fileId,
    entityId,
    submissionId,
    dropboxTypeId,
    viewFeedback,
    returnPointKey) {

    event.preventDefault();

    D2L.LP.Web.UI.Html.ReturnPoints.Set(returnPointKey);

    IsFileEpArtifact(fileId)
        .then( function ( isFileEpArtifact ) {
        if (isFileEpArtifact) {
			return GetDownloadSubmissionUrl( dropboxId, fileId, entityId, submissionId )
                .then( function( navigationUrl ) {
					var fln = UI.GetByName('fln_' + fileId)
						|| UI.GetByName('fln_F' + fileId);
					fln.SetNavigation( navigationUrl );
					window.open( navigationUrl );
				} );
        }
    }).then( function() {
        if (viewFeedback.toLowerCase() == 'true') {
            EvaluateSubmission(dropboxId, entityId, false, fileId, submissionId, dropboxTypeId);
        } else {
            DownloadFile(dropboxId, fileId, entityId, submissionId, dropboxTypeId);
        }
	} );
}

function SetReturnPointAndEvaluateOrDownloadLinkAttachment(dropboxId,
	linkId,
	linkUrl,
	entityId,
	submissionId,
    dropboxTypeId,
	viewFeedback,
	returnPointKey) {

	D2L.LP.Web.UI.Html.ReturnPoints.Set(returnPointKey);

	if (viewFeedback.toLowerCase() == 'true') {
		EvaluateSubmission(dropboxId, entityId, true, linkId, submissionId, dropboxTypeId);
	} else {
		DownloadLink(submissionId, linkId, linkUrl);
	}
}

function ReloadPopup( navigation, title, ou, objectIdType, objectId) {

function ViewParentChildrenDialog(ou, objectId, objectType, relation, advancedView) {

    var Callback = function(dlgResponse) {

        if (dlgResponse.GetType() == D2L.Dialog.ResponseType.Positive) {

            var objectType = dlgResponse.GetData('objectType')
            var objectId = dlgResponse.GetData('objectId')
            var parentId = dlgResponse.GetData('parentId')

            var n = new D2L.NavInfo();

            switch (objectType) {
                case (1):
                    n.navigation = '/d2l/lms/competencies/competency_new.d2l';
                    n.SetParam('competencyId', objectId);
                    n.SetParam('relation', relation);
                    n.SetParam('advancedView', '');
                    dlgResponse.GetDialog().Close();
                    Nav.Go(n);
                    break;
                case (2):
                    n.navigation = '/d2l/lms/competencies/objective_new.d2l';
                    n.SetParam('objectiveId', objectId);
                    n.SetParam('relation', relation);
                    n.SetParam('advancedView', '');
                    dlgResponse.GetDialog().Close();
                    Nav.Go(n);
                    break;
                case (3):
                    n.navigation = '/d2l/lms/competencies/activity_new.d2l';
                    n.SetParam('activityId', objectId);
                    n.SetParam('relation', relation);
                    n.SetParam('advancedView', '');
                    n.SetParam('parent', parentId);
                    n.SetParam('objectiveId', parentId);
                    dlgResponse.GetDialog().Close();
                    Nav.Go(n);
                    break;
                default:
                    dlgResponse.GetDialog().Close();
            }
            n.SetParam('activityId', objectId);
        }


    };

  
    var dlgViewParentChildren = new D2L.Dialog('ParentChildren');

    if (relation == PARENT) {
        dlgViewParentChildren.SetTitle('View All Parents');
    } else {
        dlgViewParentChildren.SetTitle('View All Children');
    }
    dlgViewParentChildren.AddPrimaryButton(D2L.Control.Button.Type.Close);
    dlgViewParentChildren.SetSize(615, 500);

    dlgViewParentChildren.SetCallback(Callback);

    var qs = '/d2l/lms/competencies/item_view_parentchildren.d2l?' + 'ou=' + ou + '&isPopup=1&objectId=' + objectId + '&objectType=' + objectType + '&relation=' + relation + '&advancedView=' + advancedView;

    dlgViewParentChildren.SetSrc(qs, 'SrcCallback');

    dlgViewParentChildren.Open();

}
